<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX VAULT</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Nat Grotesk Nar Bold';
            src: local('Nat Grotesk Nar Bold'), local('NatGrotesk-NarBold');
        }

        :root {
            --accent: #4db6ac;
            --bg-dark: #1a1d23;
            --card-bg: #1e2229;
            --border-color: #363b45;
            --code-bg: #14171c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #d1d5db;
            font-family: 'Nat Grotesk Nar Bold', 'Archivo Narrow', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- AUTH OVERLAY --- */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1);
        }

        .slide-up-exit { transform: translateY(-100%); }

        .discord-btn {
            background-color: #5865F2;
            color: white;
            padding: 12px 24px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
        }

        #loading-wrap { display: none; }
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(77, 182, 172, 0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- MAIN LAYOUT --- */
        #main-content { 
            display: none; 
            opacity: 0; 
            transition: opacity 0.6s ease;
            width: 95%;
            max-width: 1000px;
            margin: 80px auto 120px auto; 
        }

        .list-container {
            width: 100%; 
            border: 1px solid var(--border-color); 
            border-radius: 4px;
            background-color: var(--card-bg); 
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            margin-bottom: 30px;
        }

        /* --- HEADER --- */
        .vault-header-bar {
            padding: 35px 0;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            position: relative;
            text-align: center;
            overflow: hidden;
        }

        .vault-header-bar::after {
            content: '';
            position: absolute;
            top: -50%; left: -100%; width: 35%; height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.11), transparent);
            transform: rotate(20deg);
            animation: glass-shine 6s infinite;
        }

        @keyframes glass-shine {
            0% { left: -100%; }
            20% { left: 130%; }
            100% { left: 130%; }
        }

        .vault-title {
            font-size: 24px; 
            color: var(--accent); 
            letter-spacing: 8px; 
            font-weight: 800;
        }

        .game-row {
            display: grid; 
            grid-template-columns: 1fr 140px; 
            padding: 18px 25px; 
            border-bottom: 1px solid #2d3139; 
            align-items: center;
        }

        .info-group { display: flex; flex-direction: column; gap: 4px; }
        .game-title { color: var(--accent); font-size: 14px; font-weight: 800; text-transform: uppercase; }
        .size-subtext { color: #a1a1aa; font-size: 11px; font-family: 'Inter', sans-serif; text-transform: uppercase; }

        .download-btn {
            background-color: var(--accent); color: #1a1d23;
            padding: 10px 14px; font-size: 11px; font-weight: 800;
            border-radius: 2px; text-decoration: none; text-align: center;
            transition: 0.2s;
        }
        .download-btn:hover { background: #3d928a; color: #fff; }

        /* --- TOKEN DISPLAY SECTION --- */
        .token-section {
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            padding: 25px;
            border-radius: 4px;
        }

        .section-label {
            color: var(--accent);
            font-size: 12px;
            letter-spacing: 2px;
            margin-bottom: 15px;
            display: block;
        }

        .token-box {
            background: var(--code-bg);
            border: 1px solid #111;
            padding: 15px;
            font-family: monospace;
            font-size: 12px;
            color: #4db6ac;
            word-break: break-all;
            border-radius: 4px;
            line-height: 1.6;
            user-select: all; /* Allows easy triple-click selection */
        }

        /* --- USER CARD --- */
        #user-card {
            position: fixed; bottom: 25px; right: 25px;
            background: rgba(30, 34, 41, 0.98);
            border: 1px solid var(--border-color);
            padding: 10px 15px; border-radius: 6px; display: none;
            align-items: center; gap: 12px;
            backdrop-filter: blur(12px);
        }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); }
        .user-name { color: var(--accent); font-size: 12px; font-weight: 800; margin: 0; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <a href="https://discord.com/oauth2/authorize?client_id=1501167652477861918&response_type=token&redirect_uri=https%3A%2F%2Fapexvault.vercel.app%2Findex.html&scope=identify" 
           class="discord-btn" id="login-trigger">Login with Discord</a>
        <div id="loading-wrap"><div class="spinner"></div></div>
    </div>

    <div id="main-content">
        <div class="list-container">
            <div class="vault-header-bar"><h1 class="vault-title">APEX VAULT</h1></div>
            
            <!-- Game Rows (Same as before) -->
            <div class="game-row">
                <div class="info-group"><span class="game-title">GRAND THEFT AUTO V</span><span class="size-subtext">Size: 117.61 GB</span></div>
                <a href="https://tunnel1.dlproxy.uk/..." class="download-btn">DOWNLOAD</a>
            </div>
            <!-- ... (Keep your other game rows here) ... -->
        </div>

        <!-- NEW TOKEN DISPLAY CARD -->
        <div class="token-section">
            <span class="section-label">SESSION ACCESS TOKEN</span>
            <div id="full-token-display" class="token-box">Waiting for authentication...</div>
        </div>
    </div>

    <div id="user-card">
        <img src="" id="avatar" class="user-avatar" alt="">
        <p class="user-name" id="username">USER</p>
    </div>

    <script>
        window.onload = () => {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');

            if (token) {
                // 1. Display the token in the code box
                document.getElementById('full-token-display').innerText = token;

                document.getElementById('login-trigger').style.display = 'none';
                document.getElementById('loading-wrap').style.display = 'block';

                fetch('https://discord.com/api/users/@me', {
                    headers: { authorization: `Bearer ${token}` }
                })
                .then(r => r.json())
                .then(data => {
                    setTimeout(() => {
                        const overlay = document.getElementById('auth-overlay');
                        overlay.classList.add('slide-up-exit'); 
                        
                        setTimeout(() => {
                            overlay.style.display = 'none';
                            const main = document.getElementById('main-content');
                            main.style.display = 'block';
                            setTimeout(() => main.style.opacity = '1', 50);
                            
                            // User Info
                            document.getElementById('user-card').style.display = 'flex';
                            document.getElementById('username').innerText = data.username.toUpperCase();
                            document.getElementById('avatar').src = data.avatar ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png` : "https://cdn.discordapp.com/embed/avatars/0.png";
                            
                            // 2. CLEANUP: This wipes the token from the Search/Address Bar 
                            // but it stays visible in the "SESSION ACCESS TOKEN" box we created.
                            window.history.replaceState({}, document.title, window.location.pathname);
                            
                        }, 800);
                    }, 500);
                });
            }
        };
    </script>
</body>
</html>
